name: Update Star Plus Hotstar Cookie to Firebase

on:
  schedule:
    - cron: '0 */6 * * *' # Har 6 ghante me run hoga
  workflow_dispatch: # Manual trigger ke liye

jobs:
  update-cookie:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Targeted Cookie Fetcher & Firebase Updater
        env:
          PLAYLIST_URL: "https://game.playindia.fun/Jtv/XdEFdV/Playlist.m3u"
          DB_URL: "https://ipl2020-46d2f.firebaseio.com"
          SECRET: "MDb0Fx7XImqZtQf6d5d92rQDwbTFROsu8QZEh9sa"
        run: |
          python - <<'EOF'
          import os
          import re
          import requests
          
          playlist_url = os.environ['PLAYLIST_URL']
          db_url = os.environ['DB_URL']
          secret = os.environ['SECRET']
          
          print("Fetching playlist...")
          response = requests.get(playlist_url)
          if response.status_code != 200:
              print(f"Error: Failed to fetch playlist, status code: {response.status_code}")
              exit(1)
          
          playlist_content = response.text
          
          # Playlist ko lines ya blocks me split karein ya phir specific Star Plus block dhoondein
          # Har channel block #EXTINF se shuru hota hai
          channels = playlist_content.split('#EXTINF:')
          
          cookie_value = None
          
          for channel in channels:
              # Check karo ki block me "Star Plus" aur Hotstar ka User-Agent hai ya nahi
              if 'Star Plus' in channel and 'Hotstar' in channel:
                  # Usi block ke andar se #EXTVLCOPT:http-cookie= wali line se cookie uthao
                  cookie_match = re.search(r'#EXTVLCOPT:http-cookie=(hdntl=[^\s\r\n]+)', channel)
                  if cookie_match:
                      cookie_value = cookie_match.group(1)
                      break
          
          # Firebase endpoint URL
          firebase_get_url = f"{db_url}/cookie.json?auth={secret}"
          firebase_put_url = f"{db_url}/cookie.json?auth={secret}"
          
          if not cookie_value:
              print("Cookie na mile ya error aaye. Purana data blank nahi karenge.")
              exit(0)
          
          print(f"Extracted Star Plus Cookie: {cookie_value}")
          
          payload = {
              "hdntl": cookie_value
          }
          
          print("Updating Firebase...")
          fb_response = requests.put(firebase_put_url, json=payload)
          
          if fb_response.status_code == 200:
              print("Successfully updated Star Plus cookie to Firebase!")
          else:
              print(f"Failed to update Firebase. Response: {fb_response.text}")
              exit(1)
          EOF
