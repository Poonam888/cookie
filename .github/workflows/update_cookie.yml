name: Update Star Plus Hotstar Cookie to Firebase

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-cookie:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Targeted Cookie Fetcher & Firebase Updater
        env:
          PLAYLIST_URL: "https://game.playindia.fun/Jtv/XdEFdV/Playlist.m3u"
          DB_URL: "https://ipl2020-46d2f.firebaseio.com"
          SECRET: "MDb0Fx7XImqZtQf6d5d92rQDwbTFROsu8QZEh9sa"
        run: |
          python - <<'EOF'
          import os
          import re
          import requests
          
          playlist_url = os.environ['PLAYLIST_URL']
          db_url = os.environ['DB_URL']
          secret = os.environ['SECRET']
          
          print("Fetching playlist...")
          response = requests.get(playlist_url)
          if response.status_code != 200:
              print(f"Error: Failed to fetch playlist, status code: {response.status_code}")
              exit(1)
          
          playlist_content = response.text
          channels = playlist_content.split('#EXTINF:')
          
          cookie_value = None
          
          for channel in channels:
              if 'Star Plus' in channel and 'Hotstar' in channel:
                  cookie_match = re.search(r'#EXTVLCOPT:http-cookie=(hdntl=[^\s\r\n]+)', channel)
                  if cookie_match:
                      cookie_value = cookie_match.group(1)
                      break
          
          if not cookie_value:
              print("Cookie nahi mili ya channel match nahi hua! Purana data safe hai.")
              exit(0)
          
          print(f"Extracted Cookie: {cookie_value}")
          
          # Firebase URL with node name 'cookie'
          firebase_url = f"{db_url}/cookie.json?auth={secret}"
          
          payload = {
              "hdntl": cookie_value
          }
          
          print("Sending data to Firebase...")
          fb_response = requests.put(firebase_url, json=payload)
          
          print(f"Firebase Response Code: {fb_response.status_code}")
          print(f"Firebase Response Body: {fb_response.text}")
          
          if fb_response.status_code != 200:
              exit(1)
          EOF
