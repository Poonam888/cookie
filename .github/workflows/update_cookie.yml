Name: Update MTV Digital Hotstar Cookie to Firebase

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-cookie:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Targeted Cookie Fetcher & Firebase Updater
        env:
          PLAYLIST_URL: "https://game.playindia.fun/Jtv/XdEFdV/Playlist.m3u"
          DB_URL: "https://ipl2020-46d2f.firebaseio.com"
          SECRET: "MDb0Fx7XImqZtQf6d5d92rQDwbTFROsu8QZEh9sa"
        run: |
          python - <<'EOF'
          import os
          import re
          import requests
          
          playlist_url = os.environ['PLAYLIST_URL']
          db_url = os.environ['DB_URL']
          secret = os.environ['SECRET']
          
          print("Fetching playlist...")
          response = requests.get(playlist_url)
          if response.status_code != 200:
              print(f"Error: Failed to fetch playlist, status code: {response.status_code}")
              exit(1)
          
          playlist_content = response.text
          lines = playlist_content.splitlines()
          cookie_value = None
          
          for i, line in enumerate(lines):
              # Check for MTV Digital and Hotstar user agent block
              if 'MTV Digital' in line and 'Hotstar' in line:
                  for j in range(i, min(i + 6, len(lines))):
                      if 'http-cookie=' in lines[j] or 'Cookie=' in lines[j]:
                          match = re.search(r'(hdntl=[^\s\|"]+)', lines[j])
                          if match:
                              cookie_value = match.group(1)
                              break
                  if cookie_value:
                      break
          
          # Fallback check if specific match fails
          if not cookie_value and 'MTV Digital' in playlist_content:
              match_all = re.search(r'hdntl=([^\s\|"]+)', playlist_content)
              if match_all:
                  cookie_value = match_all.group(0)
          
          if not cookie_value:
              print("Error: MTV Digital block mil gaya par cookie extract nahi ho payi!")
              exit(0)
          
          # Yahan '&User-Agent' ya uske aage ka koi bhi variant ho toh use hata kar clean kar rahe hain
          if '&User-Agent' in cookie_value:
              cookie_value = cookie_value.split('&User-Agent')[0]
          elif '&user-agent' in cookie_value:
              cookie_value = cookie_value.split('&user-agent')[0]
          
          print(f"Cleaned Cookie to send: {cookie_value}")
          
          firebase_url = f"{db_url}/cookie.json?auth={secret}"
          
          payload = {
              "hdntl": cookie_value
          }
          
          print("Sending data to Firebase...")
          fb_response = requests.put(firebase_url, json=payload)
          
          print(f"Firebase Response Code: {fb_response.status_code}")
          print(f"Firebase Response Body: {fb_response.text}")
          
          if fb_response.status_code != 200:
              exit(1)
          EOF
